[item-name]
sc-pick-point=Pick a spot (Spider chores)

[mod-name]
spidertron-chores=Spidertron Chores

[sc-tip]
defense=When biters attack your walls, turrets or buildings, the nearest ready spider runs there, fights, and comes back when it's quiet.
turrets=Goes round gun, rocket and artillery turrets near home and tops up any running low, using the same ammo they already have (empty turrets get any ammo from its trunk that fits). It hands the ammo over when it is next to each turret.
resupply=When ammo or health runs low it walks to its restock point (home, unless you set one, e.g. your main factory) and waits to be restocked by your logistic network, then goes back home.
builder=Works like construction bots for places your roboports don't cover. It only takes ghosts and deconstruction inside its work area around home (setting), and only goes when it carries items that can build them. It builds what it has and leaves the rest for a spider that has them. With "Manage my logistic requests" on it first requests the missing materials, but only ones the network at its restock point actually has in stock. Also rebuilds things destroyed out there. Needs personal roboports in its grid.
lights=Puts small lamps around buildings near home. Where there is power it just adds the lamp; where it is dark it also puts up a pole that wires to your grid (never a stranded one). Uses lamps and poles from its trunk; its own bots build them.
nests=Goes after enemy nests and worms within range of home while healthy and stocked.
patrol=Walks between guard posts and stands at each one for a while: your saved waypoint route, or a ring of posts around home if none is saved. While standing guard it gets repaired and checks its other jobs (turrets, nests, lamps); after any job it returns to its rounds.
shuttle=Ferries between A and B. Set both points, then in the spider's Logistics fill in the "Ferry A" and "Ferry B" sections: a request loads at that stop, a request with max 0 drops it there. Only the section for the stop it's at is switched on, so nothing is swapped on the way. It leaves once robots have finished (10 s with no change) and the minimum wait is over.

