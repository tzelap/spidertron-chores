[mod-setting-description]
sc-enable-defense=Turn off to disable this job for every spider on the map.
sc-enable-resupply=Turn off to disable this job for every spider on the map.
sc-enable-turrets=Turn off to disable this job for every spider on the map.
sc-enable-builder=Turn off to disable this job for every spider on the map.
sc-enable-lights=Turn off to disable this job for every spider on the map.
sc-enable-nests=Turn off to disable this job for every spider on the map.
sc-enable-patrol=Turn off to disable this job for every spider on the map.
sc-enable-shuttle=Turn off to disable this job for every spider on the map.
sc-low-ammo="Full" is the most ammo the spider has carried. 0.25 = go home at a quarter.
sc-manual-pause=After you send it somewhere with the remote it stays out of chores this long (and until it reaches your waypoints).
sc-request-robots=Only for spiders with "Manage my logistic requests" ticked, personal roboports, and the build or lamp job.
sc-request-repair=Only for spiders with "Manage my logistic requests" ticked and personal roboports (so they can repair themselves).
sc-turret-low-stacks=Gun and rocket turrets. Counted in stacks of whatever ammo the turret uses, so it works the same for magazines and rockets. 0.1 = a tenth of a stack.
sc-turret-fill-stacks=A turret's ammo slot holds one stack, so 1 = full.
sc-request-turret-stacks=How much of each turret ammo type the spider carries, in stacks. Up to 4 ammo types.
sc-art-fill=Artillery turrets hold up to 15 shells.
sc-art-request=Shells don't stack, so each one takes a trunk slot.
sc-build-radius=Like a roboport's construction area. It ignores ghosts farther than this from its home. 0 = anywhere.
sc-guard-wait=If it is damaged it stays longer (up to 2 extra minutes) until repaired.
sc-guard-radius=Only used when no waypoint route is saved.
sc-light-poles=Only extends from poles you already have, so new poles are always connected.

